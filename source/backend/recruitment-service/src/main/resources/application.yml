server:
  port: 8084

spring:
  application:
    name: recruitment-service
  data:
    mongodb:
      uri: mongodb://mongodb:27017/hrcloud_recruitment
      database: hrcloud_recruitment
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

# File upload directory - can be overridden with environment variable
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: hrcloud_super_secret_key_for_jwt_signing_must_be_256_bits_minimum_32_chars
  expiration-ms: 86400000

logging:
  level:
    com.hrcloud: DEBUG
    org.springframework.data.mongodb: DEBUG

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

mail:
  notifications:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@hrcloud.local}
